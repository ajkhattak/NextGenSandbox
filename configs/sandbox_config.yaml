# Minimal NextGenSandbox project configuration.
# For all supported fields and correctly indented alternatives, see:
# configs/sandbox_config_reference.yaml
# https://ajkhattak.github.io/NextGenSandbox/configuration/

general:
  input_dir: "<path_to_input_directory>"
  output_dir: "<path_to_output_directory>"
  resource_layout: gage
  domain: conus
  gages:
    option: ids
    ids: ["01308000"]

subsetting:
  hydrofabric:
    version: "2.2"
    gpkg_path: "<path_to>/conus_nextgen.gpkg"
    compute_divide_attributes: true
  dem:
    output_dir: dem
    aggregate_factor: 3
  vegetation:
    enabled: false
  gages: all

forcings:
  format: ".nc"
  use_corrected: true
  rechunk: true
  time:
    start: "2016-10-01"
    end: "2020-09-30 23:00:00"
  gages: all

observations: {}

calibration:
  optimizer:
    algorithm: dds
    iterations: 400
    random_seed: 444
  objective:
    function: kge

formulations:
  pet_cfe:
    models: "PET, CFE, T-ROUTE"
    verbosity: 0

simulation:
  tasks: [calibration, validation]
  gages: all
  label: pet_cfe
  time:
    calibration:
      start: "2016-10-01 00:00:00"
      spinup: "12 months"
      evaluation: "1 year"
    validations:
      - name: validation
        start: "2018-10-01 00:00:00"
        spinup: "12 months"
        evaluation: "1 year"
  outputs:
    divide_variables: {}
    calibration:
      retention: best
    metadata:
      enabled: false
      file: simulation_metadata.yml
  partitioning:
    mode: parallel
    max_nexus_per_proc: 25
    max_procs: 3
