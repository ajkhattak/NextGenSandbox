# Complete NextGenSandbox configuration reference.
# Copy the sections you need into sandbox_config.yaml.
# Do not enable mutually exclusive alternatives simultaneously.
# Full documentation:
# https://ajkhattak.github.io/NextGenSandbox/configuration/

general:
  input_dir: "<path/to/input/directory>"
  output_dir: "<path/to/output/directory>"
  resource_layout: gage  # gage or resource
  domain: conus  # conus, hi, ak, or prvi
  gages:
    option: ids  # ids, file, or gpkg
    ids: ["01308000", "01109403"]

    # Use this instead of ids when option is file.
    # file:
    #   path: "<path/to/file>/gages.csv"
    #   column: gage_id

    # Use this instead of ids when option is gpkg.
    # gpkg:
    #   dir: "/path/to/gpkg/*_<gage_id>_*.gpkg"
    #   select: ["01308000"]

subsetting:
  hydrofabric:
    version: "2.2"
    gpkg_path: "<path/to>/conus_nextgen.gpkg"
    compute_divide_attributes: true
  dem:
    # Omit input_file to use the default DEM source.
    # input_file: "<path/to/dem>/dem.vrt"
    output_dir: dem
    aggregate_factor: 3
  vegetation:
    enabled: false
    # nlcd_path: "<path/to>/Annual_NLCD_LndCov_2021_CU_C1V1.tif"
    # classification_method: fraction  # fraction or majority
  gages: all  # all, one gage ID, or a list

forcings:
  format: ".nc"  # .nc or .csv
  use_corrected: true
  rechunk: true
  time:
    start: "2016-10-01"
    end: "2020-09-30 23:00:00"
  gages: all

  # Select existing external forcing instead of the default location.
  # The template must match exactly one file per gage.
  # forcing_dir: "<path/to/forcing>/*<gage_id>*_corrected_rechunked.nc"

observations: {}
  # streamflow:
  #   layout: point
  #   path: "<path/to/observations>/streamflow/*<gage_id>*.parquet"
  #   time_column: value_time
  #   value_column: value
  #   units: "m3/sec"

  # ET:
  #   layout: lumped
  #   path: "<path/to/observations>/ET/*<gage_id>*.parquet"
  #   time_column: value_time
  #   value_column: value
  #   units: "mm/d"
  #   simulated: ACTUAL_ET

  # Distributed observations use layout: distributed. Long format requires:
  #   id_column: divide_id
  #   value_column: value

calibration:
  optimizer:
    algorithm: dds  # dds or pso
    iterations: 400
    random_seed: 444
    # Required for custom PSO settings:
    # settings_file: "optimizers/pso.yaml"
  objective:
    # A single metric may be kge, nse, or nnse.
    function: kge
    # Build a weighted objective from multiple metrics:
    # function:
    #   kge: 0.5
    #   q10_skill: 0.3
    #   q90_skill: 0.2

formulations:
  pet_cfe:
    models: "PET, CFE, T-ROUTE"
    verbosity: 0

    # Select a non-default or custom model instance.
    # model_instances:
    #   CFE:
    #     - name: cfe-x
    #       basefile: config_cfe-x.yaml
    #       repo_name: cfe
    #       calib_params_block: cfex_params
    #       calib_params_file: cfe-x.yaml
    #       library_file: "<path/to/model/library>"

    ensemble:
      enabled: false
      members: 2
      # calib_params_groups:
      #   NOM: local
      #   CFE: global

simulation:
  tasks: [calibration, validation]  # control, calibration, validation, or restart
  gages: all
  label: pet_cfe
  time:
    # Use tasks: [control] for a control run.
    # control:
    #   start: "2016-10-01 00:00:00"
    #   spinup: "0 hours"
    #   end: "2018-09-30 23:00:00"

    calibration:
      start: "2016-10-01 00:00:00"
      spinup: "12 months"
      evaluation: "1 year"
      # end: "2018-08-01 04:00:00"

      # To evaluate only selected complete years, replace the duration above
      # with the mapping below and provide an explicit end:
      # end: "2020-09-30 23:00:00"
      # evaluation:
      #   years: [2017, 2019, 2020]
      #   year_type: water_year  # water_year or calendar_year

    validations:
      - name: validation
        start: "2018-10-01 00:00:00"
        spinup: "12 months"
        evaluation: "1 year"
        # end: "2020-08-01 04:00:00"

      # Validation periods may also be selected from a CSV file.
      # - name: water_year_split
      #   source: file
      #   file: "<path/to>/year_tasks.csv"
      #   year_type: water_year
      #   year_column: year
      #   task_column: task_type
      #   select: valid
      #   spinup: "12 months"
      #   evaluation: "1 year"

  # Required for tasks: [restart].
  # restart_dir: "<path/to/restart>/<gage_id>"

  outputs:
    divide_variables: {}
      # ACTUAL_ET:
      #   units: "m/h"
      # SNOW_WATER_EQUIVALENT:
      #   units: "mm"
    calibration:
      retention: best  # best or all
    metadata:
      enabled: false
      file: simulation_metadata.yml
      # index_dir: metadata

  partitioning:
    mode: parallel  # parallel or serial
    max_nexus_per_proc: 25
    max_procs: 3
