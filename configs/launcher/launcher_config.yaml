project:
  # Optional; defaults to this configuration filename without .yaml.
  # name: example_campaign
  input_dir: "./inputs"
  output_dir: "./outputs"
  resource_layout: gage

  gages:
    option: ids
    ids:
      #- "02299950"
      - "08070500"
      #- "03574500"
      #- "04231000"
      #- "03366500"
      #- "04282000"
      #- "05061000"
      #- "09504420"
      #- "11264500"

    # For grouped experiments over many gages, use a CSV instead:
    # option: file
    # file:
    #   path: "/path/to/gages.csv"
    #   id_column: gage_id
    #   group_column: group_name
    #
    # A gage may belong to more than one group by repeating rows or by
    # separating groups in one cell with comma, semicolon, or pipe.

sandbox:
  forcings:
    format: ".nc"
    time:
      start: "2000-10-01"
      end: "2023-09-30"
    domain: conus
    gages: all

  observations: {}

  calibration:
    optimizer:
      algorithm: dds
      iterations: 2
      random_seed: 444
    objective:
      function: kge

  simulation:
    time:
      calibration:
        start: "2015-10-01 00:00:00"
        spinup: "12 months"
        evaluation: "1 years"
      validations:
        - name: validation
          start: "2020-10-01 00:00:00"
          spinup: "12 months"
          evaluation: "1 year"

    partitioning:
      mode: parallel
      max_nexus_per_proc: 15
      max_procs: 3

    outputs:
      metadata:
        enabled: true
        index_dir: metadata
        file: simulation_metadata.yml

# Select exactly which experiment stages this launcher invocation manages.
stages: [calibration, validation]

local:
  max_workers: 2
  startup_delay_seconds: 5

# Slurm execution requires both limits. max_total_mpi_tasks caps the aggregate
# cores requested by this launcher's running and pending jobs.
# Set calibration and validation resources separately. Validation commonly
# needs more memory when its simulation period is longer.
slurm:
  max_active_jobs: 10
  max_total_mpi_tasks: 64
  startup_delay_seconds: 5
#   account: project_account
#   partition: shared
#   mpi_tasks: auto

  # Replace these examples with the modules required on the target HPC system.
  modules:
    - openmpi/4.1.6
    - netcdf-fortran/4.6.1
    - cmake/3.30.2
    - sqlite
    - udunits

  environment:
    OMP_NUM_THREADS: "1"

  calibration:
    time: "12:00:00"
    memory: "8G"
  validation:
    time: "12:00:00"
    memory: "64G"

# Optional regime calibration. For every selected experiment and gage, the
# launcher creates independent ref, wet, and dry calibration scenarios.
regime_calibration:
   execution:
     mode: priority
     order: [ref, wet, dry]

   reference:
     start: "2013-10-01 00:00:00"
     end: "2023-09-30 23:00:00"
     spinup: "12 months"
     year_type: water_year

   source:
     file: "./clusters/<gage_id>_annual_signatures_clusters.csv"
     year_column: Water_Year
     regime_column: Regime

   selection:
     max_years: 5
     order: earliest
     regimes:
       wet: Wet
       dry: Dry

