# Sandbox Launcher configuration.
# See https://ajkhattak.github.io/NextGenSandbox/launcher/ for all options.

general:
  input_dir: "./inputs"
  output_dir: "./outputs"
  resource_layout: gage
  domain: conus
  gages:
    option: ids
    ids:
      - "08070500"
    # For grouped campaign assignments, use:
    # option: file
    # file:
    #   path: "./gages.csv"
    #   column: gage_id
    #   group_column: group_name

# Resource preparation is run separately with sandbox --subset and sandbox --forc.
subsetting: {}

forcings:
  format: ".nc"
  use_corrected: true
  rechunk: true
  time:
    start: "2000-10-01"
    end: "2023-09-30 23:00:00"
  gages: all

observations: {}

calibration:
  optimizer:
    algorithm: dds
    iterations: 400
    random_seed: 444
  objective:
    function: kge

# Each entry is a formulation to run. Its selection is applied after
# general.gages and simulation.gages.
formulations:
  nom_cfe_s:
    models: "NOM, CFE, T-ROUTE"
    verbosity: 0
    selection: all
    model_instances:
      CFE:
        - name: cfe-s
          basefile: "config_cfe-s.yaml"
          repo_name: cfe
          calib_params_block: cfes_params

  #nom_cfe_x:
  #  models: "NOM, CFE, T-ROUTE"
  #  verbosity: 0
  #  selection:
  #    groups: [snowy]
  #  model_instances:
  #    CFE:
  #      - name: cfe-x
  #        basefile: "config_cfe-x.yaml"
  #        repo_name: cfe
  #        calib_params_block: cfex_params

simulation:
  tasks: [calibration, validation]
  gages: all
  time:
    calibration:
      start: "2015-10-01"
      spinup: "12 months"
      evaluation: "4 years"
    validations:
      - name: validation
        start: "2020-10-01"
        spinup: "12 months"
        evaluation: "1 year"
  partitioning:
    mode: parallel
    max_nexus_per_proc: 15
    max_procs: 5

# Scheduling and campaign expansion are the only launcher-specific settings.
launcher:
  campaign_name: regime_dds

  local:
    max_workers: 2
    startup_delay_seconds: 5

  slurm:
    max_active_jobs: 10
    max_total_mpi_tasks: 64
    max_total_allocated_cpus: 128
    startup_delay_seconds: 5
    coordinator:
      time: "00:10:00"
      memory: "1G"
    # account: project_account
    # partition: shared
    modules:
      - openmpi/4.1.6
      - netcdf-fortran/4.6.1
      - cmake/3.30.2
      - sqlite
      - udunits
    environment:
      OMP_NUM_THREADS: "1"
    calibration:
      time: "12:00:00"
      memory: "8G"
    validation:
      time: "12:00:00"
      memory: "64G"

  # Optional regime expansion. It creates ref, wet, and dry calibration
  # scenarios for every assigned gage and formulation.
  regime_calibration:
    execution:
      mode: priority
      order: [ref, wet, dry]
    reference:
      start: "2013-10-01 00:00:00"
      end: "2023-09-30 23:00:00"
      spinup: "12 months"
      year_type: water_year
    source:
      file: "./clusters/<gage_id>_annual_signatures_clusters.csv"
      year_column: Water_Year
      regime_column: Regime
    selection:
      max_years: 5
      order: earliest
      regimes:
        wet: Wet
        dry: Dry
