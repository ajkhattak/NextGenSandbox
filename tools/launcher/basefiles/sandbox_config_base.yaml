# Sandbox configuration sample file

general:
  input_dir     : "/Users/ahmadjankhattak/Core/projects/synthetic_2026/inputs"
  output_dir    : "/Users/ahmadjankhattak/Core/projects/synthetic_2026/basecase"
  resource_layout: gage
  gages:
    option: ids
    ids: []


########################################################################
forcings : 
  format     : ".nc"
  time       : {"start_time" : "2015-10-01 00:00:00", "end_time" : "2022-09-30 23:00:00"}
  domain     : "conus"        # options = ["conus", "HI", "PR", 'AK']
  gages      : all

########################################################################
formulation :
  models             : ""
  clean              : ['existing']
  verbosity          : 0

simulation :
  task_type : "calibvalid" # calibvalid, calibration, validation, restart, control
  gages     : []
  time:
    calibration:
      start: "2015-10-01 00:00:00"
      spinup: "12 months"
      evaluation: "4 years"
    validations:
      - name: validation
        start: "2020-10-01 00:00:00"
        spinup: "12 months"
        evaluation: "1 year"

  partitioning:
    mode: parallel
    max_nexus_per_proc: 20
    max_procs: 10

  outputs:
    metadata:
      enabled: true
      index_dir: metadata
      run_file: run_metadata.yml
