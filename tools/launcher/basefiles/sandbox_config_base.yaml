# Base Sandbox configuration used by the Launcher.
# Project paths, gages, and formulation are injected from launcher_config.yaml.


########################################################################
forcings : 
  format     : ".nc"
  time       : {"start" : "2000-10-01", "end" : "2023-09-30 23:00:00"}
  domain     : "conus"        # options = ["conus", "HI", "PR", 'AK']
  gages      : all

########################################################################
observations: {}

calibration:
  optimizer:
    algorithm: dds
    iterations: 2
    random_seed: 444
  objective:
    function: kge

simulation :
  time:
    calibration:
      start: "2015-10-01 00:00:00"
      spinup: "12 months"
      evaluation: "2 years"
    validations:
      - name: validation
        start: "2020-10-01 00:00:00"
        spinup: "12 months"
        evaluation: "1 year"

  partitioning:
    mode: parallel
    max_nexus_per_proc: 15
    max_procs: 3

  outputs:
    metadata:
      enabled: true
      index_dir: metadata
      file: simulation_metadata.yml
