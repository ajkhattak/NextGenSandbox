project:
  input_dir: "/Users/ahmadjankhattak/Core/projects/dynamic_model_selection/inputs"
  output_dir: "/Users/ahmadjankhattak/Core/projects/dynamic_model_selection/outputsX"
  resource_layout: gage

templates:
  sandbox_config: basefiles/sandbox_config_base.yaml

submit_script: submit_gage.slurm

execution:
  num_workers: 2
  startup_delay_seconds: 5

# Optional SLURM overrides. Command-line options generated by the launcher
# override matching #SBATCH defaults in submit_gage.slurm.
# slurm:
#   account: project_account
#   partition: shared
#   time: "12:00:00"
#   memory: "8G"
#   mpi_tasks: auto

# Optional regime calibration. For every assigned experiment and gage, the
# launcher creates independent ref, wet, and dry calibration scenarios.
regime_calibration:
   reference:
     start: "2013-10-01 00:00:00"
     end: "2023-09-30 23:00:00"
     spinup: "12 months"
     year_type: water_year

   source:
     file: "/Users/ahmadjankhattak/Core/projects/dynamic_model_selection/clusters/<gage_id>_annual_signatures_clusters.csv"
     year_column: Water_Year
     regime_column: Regime

   selection:
     max_years: 5
     order: earliest
     regimes:
       wet: Wet
       dry: Dry

