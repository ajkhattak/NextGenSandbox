project:
  input_dir: "/Users/ahmadjankhattak/Core/projects/synthetic_2026/inputs"
  output_dir: "/Users/ahmadjankhattak/Core/projects/synthetic_2026/basecase"
  resource_layout: gage

templates:
  sandbox_config: basefiles/sandbox_config_base.yaml

submit_script: submit_gage.slurm

execution:
  num_workers: 2
  startup_delay_seconds: 5

experiments:
  pet_cfe_s:
    models: "PET, CFE, T-route"
    model_instances:
      CFE:
        - name: cfe-s
          basefile: "config_cfe-s.yaml"
          repo_name: "cfe"
          calib_params_block: "cfes_params"

  pet_cfe_x:
    models: "PET, CFE, T-route"
    model_instances:
      CFE:
        - name: cfe-x
          basefile: "config_cfe-x.yaml"
          repo_name: "cfe"
          calib_params_block: "cfex_params"

  pet_topmodel:
    models: "PET, TopModel, T-route"

  nom_cfe_s:
    models: "NOM, CFE, T-route"
    model_instances:
      CFE:
        - name: cfe-s
          basefile: "config_cfe-s.yaml"
          repo_name: "cfe"
          calib_params_block: "cfes_params"

  nom_cfe_x:
    models: "NOM, CFE, T-route"
    model_instances:
      CFE:
        - name: cfe-x
          basefile: "config_cfe-x.yaml"
          repo_name: "cfe"
          calib_params_block: "cfex_params"

gages:
  option: ids
  ids:
    - "02299950"
    - "08070500"
    - "03574500"
    - "04231000"
    - "03366500"
    - "04282000"
    - "05061000"
    - "09504420"
    - "11264500"

  # For grouped experiments over many gages, use a CSV instead:
  # option: file
  # file:
  #   path: "/path/to/gages.csv"
  #   id_column: gage_id
  #   group_column: group_name
  #
  # A gage may belong to more than one group by repeating rows:
  # gage_id,group_name
  # 01109403,snowy
  # 01109403,benchmark
  #
  # Or by separating groups in one cell with comma, semicolon, or pipe:
  # 01109403,"snowy;benchmark"

assignment:
  # Use all to run every experiment over every gage:
  # default:
  #   - all
  default:
    - pet_cfe_s
    - pet_cfe_x
    - pet_topmodel

  # Group assignments are used when gages.option: file and group_column is set.
  # If a gage belongs to multiple groups, experiment lists are merged.
  groups:
    snowy:
      - nom_cfe_s
      - nom_cfe_x

    arid:
      - pet_topmodel

    non-snowy:
      - pet_cfe_s
      - pet_cfe_x
